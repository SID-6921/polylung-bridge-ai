name: PD1 Cloud Train

on:
  workflow_dispatch:
    inputs:
      dataset_url:
        description: "HTTP/HTTPS URL to LungHist700 archive (.zip or .tar.gz)"
        required: false
        type: string
      epochs:
        description: "Training epochs"
        required: false
        default: "8"
        type: string
      batch_size:
        description: "Batch size"
        required: false
        default: "8"
        type: string

jobs:
  train-pd1:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pd1.txt
          pip install -r backend/requirements.txt

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Resolve dataset URL
        id: ds
        env:
          INPUT_DATASET_URL: ${{ github.event.inputs.dataset_url }}
          SECRET_DATASET_URL: ${{ secrets.LUNGHIST700_URL }}
        run: |
          set -euo pipefail
          DATASET_URL="$INPUT_DATASET_URL"
          if [ -z "$DATASET_URL" ]; then
            DATASET_URL="$SECRET_DATASET_URL"
          fi
          if [ -z "$DATASET_URL" ]; then
            echo "No dataset URL provided. Pass workflow input 'dataset_url' or set secret LUNGHIST700_URL."
            exit 1
          fi

          # Convert Figshare article links with ?file=<id> into direct download links.
          if [[ "$DATASET_URL" == *"figshare.com/articles"*"file="* ]]; then
            FILE_ID="$(DATASET_URL="$DATASET_URL" python - << 'PY'
          import os
          from urllib.parse import parse_qs, urlparse
          u = os.environ['DATASET_URL']
          q = parse_qs(urlparse(u).query)
          print((q.get('file') or [''])[0])
          PY
            )"
            if [ -n "$FILE_ID" ]; then
              DATASET_URL="https://ndownloader.figshare.com/files/${FILE_ID}"
            fi
          fi

          echo "dataset_url=$DATASET_URL" >> "$GITHUB_OUTPUT"

      - name: Download and extract dataset
        env:
          DATASET_URL: ${{ steps.ds.outputs.dataset_url }}
        run: |
          set -euo pipefail
          mkdir -p data/raw/LungHist700
          curl -L "$DATASET_URL" -o data/raw/LungHist700/dataset_archive
          python - << 'PY'
          import os
          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path

          archive = Path("data/raw/LungHist700/dataset_archive")
          out_root = Path("data/raw/LungHist700/extracted")
          out_root.mkdir(parents=True, exist_ok=True)

          # Try zip first, then tar.*. This keeps the workflow deterministic for common archive types.
          extracted = False
          if zipfile.is_zipfile(archive):
              with zipfile.ZipFile(archive) as zf:
                  zf.extractall(out_root)
              extracted = True
          else:
              try:
                  with tarfile.open(archive) as tf:
                      tf.extractall(out_root)
                  extracted = True
              except tarfile.ReadError:
                  extracted = False

          if not extracted:
              # Fallback to 7z for rar/other container formats.
              res = subprocess.run(["7z", "x", str(archive), f"-o{out_root}", "-y"], check=False)
              extracted = res.returncode == 0

          if not extracted:
              raise SystemExit("Unsupported archive format or extraction failure")

          # Auto-discover images directory by expected LungHist700 class folders.
          required = {"nor", "aca_bd", "aca_md", "aca_pd", "scc_bd", "scc_md", "scc_pd"}
          candidates = []
          for p in out_root.rglob("*"):
              if not p.is_dir():
                  continue
              child_dirs = {x.name.lower() for x in p.iterdir() if x.is_dir()}
              if required.issubset(child_dirs):
                  candidates.append(p)

          # Fallback: sometimes classes are nested deeper (e.g., extracted/.../data/images/<class_name>).
          if not candidates:
              class_parents = {}
              for p in out_root.rglob("*"):
                  if p.is_dir() and p.name.lower() in required:
                      class_parents.setdefault(p.parent, set()).add(p.name.lower())
              for parent, seen in class_parents.items():
                  if required.issubset(seen):
                      candidates.append(parent)

          if not candidates:
              raise SystemExit("Could not locate LungHist700 images root in extracted archive")

          chosen = sorted(candidates, key=lambda x: len(str(x)))[0]
          Path("data/raw/LungHist700/images_root.txt").write_text(str(chosen), encoding="utf-8")
          print(f"Resolved images root: {chosen}")
          PY

      - name: Prepare binary split
        run: |
          set -euo pipefail
          SRC="$(cat data/raw/LungHist700/images_root.txt)"
          python scripts/pd1_prepare_lunghist700_binary.py \
            --source "$SRC" \
            --output data/lunghist700_binary \
            --summary evidence/public/pd1/dataset_split_summary.json

      - name: Train PD-1
        run: |
          set -euo pipefail
          python scripts/pd1_train_swin_lunghist700.py \
            --data-dir data/lunghist700_binary \
            --epochs "${{ github.event.inputs.epochs || '8' }}" \
            --batch-size "${{ github.event.inputs.batch_size || '8' }}" \
            --num-workers 0 \
            --lr 1e-4 \
            --pretrained \
            --output evidence/public/pd1/pd1_metrics.json

      - name: Run tests
        run: |
          set -euo pipefail
          PYTHONPATH=backend pytest -q

      - name: Upload PD-1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pd1-cloud-artifacts
          path: |
            evidence/public/pd1/pd1_metrics.json
            evidence/public/pd1/dataset_split_summary.json